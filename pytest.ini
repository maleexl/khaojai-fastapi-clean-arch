[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: Unit tests (no DB, no HTTP)
    api: API tests using httpx.AsyncClient + ASGITransport
    architecture: Architecture / dependency-direction tests
    e2e: End-to-end tests (Playwright, optional)
